<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b1e">
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="description" content="Sword Meteor Runner — khóa mục tiêu, nâng cấp và phóng chùm kiếm truy tung phá thiên thạch.">
  <title>Sword Fight Meteor</title>
  <link rel="stylesheet" href="./src/style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <main class="game-shell">
    <canvas id="game" aria-label="Trò chơi Sword Meteor Runner"></canvas>

    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>

    <header class="topbar" style="display: none;">
      <a class="brand" href="#" aria-label="Sword Meteor Runner">
        <span class="brand__mark" aria-hidden="true">◆</span>
        <span>
          <strong>SWORD METEOR</strong>
          <small>HOMING FAN PROTOCOL</small>
        </span>
      </a>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status__dot"></span>
        <span id="status-text">Đang nạp đấu trường…</span>
      </div>
    </header>

    <section class="hud" aria-label="Thông tin trận đấu">
      <div id="pause-button" class="hud-card hud-card--score">
        <span class="hud-card__label">Dừng</span>
        <span class="pause-icon" aria-hidden="true">
          <i></i>
          <i></i>
        </span>
      </div>
      <div class="hud-card hud-card--score">
        <span class="hud-card__label">Điểm</span>
        <strong id="score">0000</strong>
      </div>
      <div class="hud-card hud-card--shield">
        <span class="hud-card__label">Lá chắn</span>
        <div class="shield" id="shield" aria-label="3 điểm lá chắn">
          <i></i><i></i><i></i>
        </div>
      </div>
      <div class="hud-card hud-card--level" id="level-card">
        <span class="hud-card__label">Cấp độ</span>
        <div class="level-readout">
          <strong>LV <span id="level">1</span></strong>
          <div class="level-progress" id="level-progress" aria-label="0 trên 3 điểm cấp độ">
            <i></i><i></i><i></i>
          </div>
        </div>
      </div>
    </section>

    <div class="reticle" id="reticle" aria-hidden="true">
      <span></span>
    </div>

    <div class="hit-label" id="hit-label" aria-live="polite"></div>

    <section class="start-screen" id="start-screen" aria-labelledby="game-title">
      <div class="start-card">
        <h1 id="game-title">Kiếm tiên<br><em>phá thiên thạch</em></h1>
        <div class="instructions" aria-label="Cách chơi" style="display: none;">
          <div>
            <kbd>CHẠM</kbd>
            <span>Chỉnh hướng bắn</span>
          </div>
          <div>
            <kbd>SPACE</kbd>
            <span>Bắn liên hoàn</span>
          </div>
          <div>
            <kbd>ESC</kbd>
            <span>Tạm dừng</span>
          </div>
        </div>

        <button id="start" type="button" disabled>
          <span id="start-label">Đang tải…</span>
          <b aria-hidden="true">→</b>
        </button>

        <p class="best">Kỷ lục: <strong id="best-score">0000</strong></p>
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
